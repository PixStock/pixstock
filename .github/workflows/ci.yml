name: CI

# Everything that can be checked without a key, a token or someone's money.
#
# The live suite is deliberately absent: it calls Jupiter, a Solana RPC and
# the Pyth router, and a red build caused by someone else's rate limit teaches
# the team to ignore red builds. Run `npm run test:live` before a merge that
# touches routing, and before the demo.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The integration suites truncate tables between tests, so they get their
  # own database. Never point this at anything that holds real orders.
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pixstock_test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pixstock_test

jobs:
  checks:
    name: lint · typecheck · tests · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pixstock_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create the schema the integration suites expect
        run: npx prisma migrate deploy --schema apps/relayer/prisma/schema.prisma

      - name: Build the shared packages
        run: npm run build:packages

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  system:
    name: system tests
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the browser Playwright drives
        run: npx playwright install --with-deps chromium

      - run: npm run test:system

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
